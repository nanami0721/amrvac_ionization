name: Ubuntu autotest comparison
run-name: AMRVAC 3.3 — GCC 14.3 default vs x86-64 vs contraction off

on:
  push:
    branches: [codex/ubuntu-autotest-comparison]
    paths:
      - .github/workflows/ubuntu-comparison.yml
      - .github/scripts/ubuntu_comparison.py
      - .github/scripts/build_comparison_mpi.sh
      - .github/scripts/run_flag_comparison.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'nanami0721/amrvac_ionization'
    name: Ubuntu 26 / same GCC 14.3 / three flag settings
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      ARCH: debug
      NUM_PROCS: '2'
      OMP_NUM_THREADS: '1'
      HWLOC_LIBXML: '0'
      CC: gcc-14
      CXX: g++-14
      FC: gfortran-14
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out unchanged AMRVAC for default
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-default
          persist-credentials: false
      - name: Check out unchanged AMRVAC for x86-64
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-x86-64
          persist-credentials: false
      - name: Check out unchanged AMRVAC for contract-off
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-contract-off
          persist-credentials: false
      - name: Install one common compiler and dependencies
        run: |
          mkdir -p results
          sudo apt-get update 2>&1 | tee results/apt-update.log
          sudo apt-get install -y gcc-14 g++-14 gfortran-14 make perl curl bzip2 binutils 2>&1 | tee results/apt-install.log
          test "$(gfortran-14 -dumpfullversion)" = 14.3.0
          gfortran-14 -v > results/package-compiler.txt 2>&1
          dpkg-query -W > results/packages.txt
          lscpu > results/cpu.txt
      - name: Build OpenMPI once for all three settings
        run: bash .github/scripts/build_comparison_mpi.sh
      - name: Compare default target, base x86-64, and disabled contraction
        run: python3 .github/scripts/run_flag_comparison.py
      - name: Save provenance and results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc14-flags-ubuntu26-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: error
