name: Ubuntu autotest comparison
run-name: AMRVAC 3.3 — GCC 15.2 default vs contraction off

on:
  push:
    branches: [codex/ubuntu-autotest-comparison]
    paths:
      - .github/workflows/ubuntu-comparison.yml
      - .github/scripts/ubuntu_comparison.py
      - .github/scripts/build_comparison_mpi.sh
      - .github/scripts/run_flag_comparison.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'nanami0721/amrvac_ionization'
    name: Ubuntu 26 / same GCC 15.2 / two flag settings
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      ARCH: debug
      NUM_PROCS: '2'
      OMP_NUM_THREADS: '1'
      HWLOC_LIBXML: '0'
      CC: gcc-15
      CXX: g++-15
      FC: gfortran-15
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out unchanged AMRVAC for default
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-default
          persist-credentials: false
      - name: Check out unchanged AMRVAC for contract-off
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-contract-off
          persist-credentials: false
      - name: Install one common compiler and dependencies
        run: |
          mkdir -p results
          sudo apt-get update 2>&1 | tee results/apt-update.log
          sudo apt-get install -y gcc-15 g++-15 gfortran-15 make perl curl bzip2 binutils 2>&1 | tee results/apt-install.log
          test "$(gfortran-15 -dumpfullversion)" = 15.2.0
          gfortran-15 -v > results/package-compiler.txt 2>&1
          dpkg-query -W > results/packages.txt
          lscpu > results/cpu.txt
      - name: Build OpenMPI once for both settings
        run: bash .github/scripts/build_comparison_mpi.sh
      - name: Compare default and disabled contraction
        run: python3 .github/scripts/run_flag_comparison.py
      - name: Save provenance and results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc15-flags-ubuntu26-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: error
