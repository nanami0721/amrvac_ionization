name: Ubuntu autotest comparison
run-name: AMRVAC 3.3 at 91f50912 — GCC 13–15 with common OpenMPI 5.0.10

on:
  push:
    branches: [codex/ubuntu-autotest-comparison]
    paths:
      - .github/workflows/ubuntu-comparison.yml
      - .github/scripts/ubuntu_comparison.py
      - .github/scripts/build_comparison_mpi.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'nanami0721/amrvac_ionization'
    name: ${{ matrix.os }} / GCC ${{ matrix.gcc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            gcc: '13'
          - os: ubuntu-24.04
            gcc: '14'
          - os: ubuntu-26.04
            gcc: '13'
          - os: ubuntu-26.04
            gcc: '14'
          - os: ubuntu-26.04
            gcc: '15'
    env:
      FC: gfortran-${{ matrix.gcc }}
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      OMPI_FC: gfortran-${{ matrix.gcc }}
      EXPECTED_GCC_MAJOR: ${{ matrix.gcc }}
      ARCH: debug
      NUM_PROCS: '2'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out unchanged AMRVAC 3.3
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source
          persist-credentials: false
      - name: Install selected compiler
        run: |
          mkdir -p results
          sudo apt-get update 2>&1 | tee results/apt-update.log
          sudo apt-get install -y "$FC" "$CC" "$CXX" make perl curl bzip2 2>&1 | tee results/apt-install.log
      - name: Build common OpenMPI with selected compiler
        run: bash .github/scripts/build_comparison_mpi.sh
      - name: Record environment and run twelve regression cases
        run: python3 .github/scripts/ubuntu_comparison.py source results
      - name: Save logs even when comparisons fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-${{ matrix.os }}-gcc${{ matrix.gcc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: error
