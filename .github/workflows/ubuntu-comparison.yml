name: Ubuntu autotest comparison
run-name: AMRVAC 3.3 — exact GCC 14.2 vs 14.3 on one Ubuntu 26 host

on:
  push:
    branches: [codex/ubuntu-autotest-comparison]
    paths:
      - .github/workflows/ubuntu-comparison.yml
      - .github/scripts/ubuntu_comparison.py
      - .github/scripts/build_comparison_mpi.sh
      - .github/scripts/build_exact_gcc.sh
      - .github/scripts/run_exact_comparison.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'nanami0721/amrvac_ionization'
    name: Ubuntu 26 / exact GCC 14.2 and 14.3 / shared MPI and runtime
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      ARCH: debug
      NUM_PROCS: '2'
      OMP_NUM_THREADS: '1'
      HWLOC_LIBXML: '0'
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out unchanged AMRVAC for GCC 14.2
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-14.2.0
          persist-credentials: false
      - name: Check out unchanged AMRVAC for GCC 14.3
        uses: actions/checkout@v6
        with:
          ref: 91f5091258cd8948f3a189a53c1c19ee15eb1974
          path: source-14.3.0
          persist-credentials: false
      - name: Install common build dependencies
        run: |
          mkdir -p results
          sudo apt-get update 2>&1 | tee results/apt-update.log
          sudo apt-get install -y gcc-14 g++-14 gfortran-14 make perl curl bzip2 xz-utils libgmp-dev libmpfr-dev libmpc-dev libisl-dev 2>&1 | tee results/apt-install.log
          dpkg-query -W > results/packages.txt
          lscpu > results/cpu.txt
          df -h > results/disk-before.txt
      - name: Build exact official GCC releases with the same host compiler
        run: bash .github/scripts/build_exact_gcc.sh
      - name: Build OpenMPI once with GCC 14.2 Fortran
        run: |
          export FC="$RUNNER_TEMP/exact-gcc-14.2.0/bin/gfortran"
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
          bash .github/scripts/build_comparison_mpi.sh
      - name: Run both compilers with identical MPI and runtime binaries
        run: python3 .github/scripts/run_exact_comparison.py
      - name: Save provenance and results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-gcc14-ubuntu26-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: error
